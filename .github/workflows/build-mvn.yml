name: Maven Build Pipeline

on:
  push:
    branches: [ "master" ]


jobs:

  checkout:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

  check_java_version:
    runs-on: self-hosted
    needs: checkout
    steps:
      - name: Check Java Version
        run: java -version

  package:
    runs-on: self-hosted
    needs: check_java_version
    steps:
      - name: Build Project
        run: mvn clean package

  remove_old_artifact:
    runs-on: self-hosted
    needs: package
    steps:
      - name: remove old artifact
        run: cd /opt/ && sudo rm -f *

  deliver:
    runs-on: self-hosted
    needs: remove_old_artifact
    steps:
      - name: delever artifact
        run: sudo cp /home/ubuntu/actions-runner/_work/testing/testing/target/*.jar /opt/my-app.jar

  deliver_s3:
    runs-on: self-hosted
    needs: deliver
    steps:
      - name: delever artifact to s3
        run: aws s3 cp /home/ubuntu/actions-runner/_work/testing/testing/target/*.jar s3://sayli-ankush/my-app_$(date +%Y-%m-%d-%T).jar

  deploy:
    runs-on: self-hosted
    needs: deliver_s3
    steps:
      - name: deploy artifact
        run:  sudo bash -c "java -jar /opt/my-app.jar > /opt/app.log 2>&1"
        
